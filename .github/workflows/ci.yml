# Verification CI. `release.yml` publishes binaries; nothing checked that the code WORKS.
#
# For an open-source storage engine that claim matters more than the README: anyone evaluating it
# is deciding whether to trust a file format with their data, and "the maintainer says the tests
# pass" is not evidence. Every gate below was run locally and observed green before being added —
# a workflow that lands red teaches contributors to ignore CI.
#
# The suite is fast (~1 min) because the shard is a local file: no services, no fixtures, no
# network. That is a property worth keeping — the moment CI needs a running database, contributors
# stop running it before pushing.
name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is a supported storage target too: its LockFileEx implementation must pass
        # the same shard-isolation suite as Unix flock. Linux/macOS retain mmap and sparse-file
        # coverage across their differing kernels/filesystems.
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: crate
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The Rust PTY integration starts the checked-in Node TUI under a real pseudo-terminal.
      # Pin the supported Node floor here instead of relying on an image-provided runtime.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # usearch builds a C++ core, so the build is the slow part, not the tests.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crate

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # The engine's whole promise is that a shard survives a crash and reopens intact. Naming
      # that suite explicitly means a maintainer reading a failed run sees WHICH guarantee broke,
      # instead of one undifferentiated red X across 29 targets.
      - name: Durability suite (crash safety, compaction, invariants)
        run: cargo test -p mseg --test crash_safety --test compact --test invariants

      - name: Harness killed-writer recovery
        run: cargo test -p icarus-harness --features test-failpoints --test runtime killed_writer_

  # The Rust job above protects the storage engine. This one protects everything a USER
  # actually touches: the CLI's argument parsing and exit codes, the TUI's rendering and
  # scrollback, the project-instruction installers that edit files in someone else's
  # repository, and the single-source-of-truth version wiring.
  #
  # None of it needs a Cargo build, and that is deliberate: cli-lib.js loads the native addon
  # LAZILY, so every command that does not touch a shard works on a checkout with no
  # toolchain. Keeping this job toolchain-free both makes it fast (~1s) and continuously
  # proves that lazy-loading property still holds — if someone converts it to a top-level
  # require, this job goes red instead of every no-toolchain install silently breaking.
  node:
    name: node (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The Node shell is presentation/transport only, but it is how Windows users invoke
        # the compiled CLI, updater, and installer. Run its non-native suites on every target.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20   # the minimum install.sh accepts; testing the floor, not just latest

      # The CLI version is baked into the binary at build time (a single self-contained
      # executable cannot read a VERSION file that is not shipped beside it), so VERSION and
      # the literal in cli-lib.js are necessarily two copies. This is the gate that stops them
      # drifting into a release where the tag, the binary, and the update check disagree.
      - name: Version single-source-of-truth check
        run: node scripts/version.mjs --check

      # Unit tests import actual declared dependencies (Zod/YAML/MCP SDK).  Installing here also
      # keeps this lightweight job honest: a checkout must pass from package-lock alone.
      - name: Install Node dependencies
        working-directory: crate/mneme-node
        run: npm ci

      - name: Node tests (CLI, TUI, installers, version)
        working-directory: crate/mneme-node
        run: npm test

      - name: Installer shell syntax
        shell: bash
        run: bash -n install.sh

      - name: Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: "[scriptblock]::Create((Get-Content install.ps1 -Raw)) | Out-Null"

  # MCP framing tests above intentionally run without a native addon.  This complementary job
  # builds the Rust addon and proves the stdio server can persist and recall from a real local
  # shard.  It has no credentials or network dependency: lexical ingest/recall is the local-only
  # product guarantee that must keep working for every open-source user.
  node-native-mcp:
    name: node native MCP (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # A Windows Rust build alone cannot prove the NAPI artifact can load or that the actual
        # MCP process can open a locked local shard. Exercise the same native round-trip there.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crate

      - name: Install Node dependencies
        working-directory: crate/mneme-node
        run: npm ci

      - name: Build the local native addon
        working-directory: crate/mneme-node
        run: npm run build:debug

      - name: Native MCP shard round-trip
        working-directory: crate/mneme-node
        run: npm run test:engine

  # A release workflow can mask packaging breakage because it is both the producer and verifier
  # of the artifact.  Build the single-file executable independently on the normal public CI
  # path and make it open a native shard, write a memory, then recall it.  This covers Bun's
  # native-addon embedding as received by an open-source user, not merely source-mode Node.
  compiled-cli:
    name: compiled CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # This is the user-facing artifact gate. Windows must compile and execute the embedded
        # addon before it can be named as a release target.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crate

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Node dependencies and build native addon
        working-directory: crate/mneme-node
        run: |
          npm ci
          npm run build:debug

      - name: Compile and exercise the self-contained CLI
        working-directory: crate/mneme-node
        shell: bash
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/icarus-ci"
          HOME_DIR="$RUNNER_TEMP/icarus-ci-home"
          bun build --compile ./mneme-cli.js --outfile "$BIN"
          [ "$("$BIN" --version)" = "$(tr -d '[:space:]' < ../../VERSION)" ]
          ICARUS_HOME="$HOME_DIR" "$BIN" save "compiled binary native shard round trip" --org ci-e2e
          ICARUS_HOME="$HOME_DIR" "$BIN" recall "compiled binary native shard" --org ci-e2e | grep -Fi "compiled binary native shard round trip"

  # Separate job, not folded into `test`: mneme-python's `extension-module` pyo3 feature cannot
  # link under plain `cargo build`/`cargo test` (Python provides its own symbols at dlopen time,
  # so a maturin-style build is required) -- proved locally when adding this crate broke the
  # `test` job's `cargo test --workspace` until extension-module was moved out of the crate's
  # default features into maturin's own build-time flag. Building the actual wheel and running
  # real tests against it here is what keeps that fix honest going forward.
  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: crate/mneme-python
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crate

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # langchain-core / llama-index-core are installed here so those integration tests actually
      # run rather than silently skipping via pytest.importorskip.
      - name: Create test environment and install maturin, pytest, and optional integrations
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install maturin pytest langchain-core llama-index-core

      - name: Build wheel and install into this environment
        run: .venv/bin/maturin develop --release

      - name: Python tests
        run: .venv/bin/python -m pytest tests/ -v
