# Verification CI. `release.yml` publishes binaries; nothing checked that the code WORKS.
#
# For an open-source storage engine that claim matters more than the README: anyone evaluating it
# is deciding whether to trust a file format with their data, and "the maintainer says the tests
# pass" is not evidence. Every gate below was run locally and observed green before being added —
# a workflow that lands red teaches contributors to ignore CI.
#
# The suite is fast (~1 min) because the shard is a local file: no services, no fixtures, no
# network. That is a property worth keeping — the moment CI needs a running database, contributors
# stop running it before pushing.
name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux and macOS both matter: the engine mmaps files and relies on sparse-file and
        # page-cache behaviour that differs between them. A single-platform run would not catch
        # a regression that only shows up on the other.
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: crate
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # usearch builds a C++ core, so the build is the slow part, not the tests.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crate

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # The engine's whole promise is that a shard survives a crash and reopens intact. Naming
      # that suite explicitly means a maintainer reading a failed run sees WHICH guarantee broke,
      # instead of one undifferentiated red X across 29 targets.
      - name: Durability suite (crash safety, compaction, invariants)
        run: cargo test -p mseg --test crash_safety --test compact --test invariants

  # Separate job, not folded into `test`: mneme-python's `extension-module` pyo3 feature cannot
  # link under plain `cargo build`/`cargo test` (Python provides its own symbols at dlopen time,
  # so a maturin-style build is required) -- proved locally when adding this crate broke the
  # `test` job's `cargo test --workspace` until extension-module was moved out of the crate's
  # default features into maturin's own build-time flag. Building the actual wheel and running
  # real tests against it here is what keeps that fix honest going forward.
  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: crate/mneme-python
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crate

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # langchain-core / llama-index-core are installed here so those integration tests actually
      # run rather than silently skipping via pytest.importorskip.
      - name: Install maturin, pytest, and the optional integrations
        run: pip install maturin pytest langchain-core llama-index-core

      - name: Build wheel and install into this environment
        run: maturin develop --release

      - name: Python tests
        run: python -m pytest tests/ -v
