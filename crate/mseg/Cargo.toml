[package]
name = "mseg"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "mneme .mseg storage engine: mmap'd segment, CRUD, multi-tenant shard"

[lib]
name = "mseg"
path = "src/lib.rs"

[[bin]]
name = "mseg-bench"
path = "src/bin/bench.rs"

[dependencies]
mseg-format = { path = "../mseg-format" }
mnsw-index = { path = "../mnsw-index" }
memmap2.workspace = true
zerocopy.workspace = true

[target.'cfg(unix)'.dependencies]
# advisory shard lock via flock(2) (SPEC §4.3, see shard.rs for the fcntl-vs-flock note)
libc = "=0.2.186"

[dev-dependencies]
proptest = "=1.5.0"
tempfile = "=3.13.0"

[[bin]]
name = "solvis-demo"
path = "src/bin/solvis.rs"
