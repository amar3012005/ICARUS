[package]
name = "mneme-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "mneme Node.js binding (napi-rs) — drop-in vector store for HIVEMIND"

[lib]
crate-type = ["cdylib"]

[dependencies]
mseg = { path = "../mseg" }
mneme-bm25 = { path = "../mneme-bm25" }
napi = { version = "2", default-features = false, features = ["napi6"] }
napi-derive = "2"
ml-dsa = "0.1.1"
signature = "3"
slh-dsa = "0.2.0-rc.5"
rand_core = "0.10"
getrandom = "0.4"

[build-dependencies]
napi-build = "2"
