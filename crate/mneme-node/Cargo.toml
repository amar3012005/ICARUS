[package]
name = "mneme-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "mneme Node.js binding (napi-rs) — drop-in vector store for HIVEMIND"

[lib]
crate-type = ["cdylib"]

[dependencies]
mseg = { path = "../mseg" }
napi = { version = "2", default-features = false, features = ["napi6"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"
