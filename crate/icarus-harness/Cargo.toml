[package]
name = "icarus-harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Durable, offline ICARUS coding-agent harness core"

[features]
# Test-only crash points exercise recovery after a real process abort. They are never enabled in
# release artifacts, so runtime environment variables cannot alter production persistence.
test-failpoints = []

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
serde_yaml = "=0.9.34"
sha2 = "=0.10.9"
globset = "=0.4.16"
time = { version = "=0.3.36", features = ["formatting", "parsing"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
mseg = { path = "../mseg" }
mneme-bm25 = { path = "../mneme-bm25" }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"

[dev-dependencies]
tempfile = "=3.13.0"
portable-pty = "=0.9.0"
